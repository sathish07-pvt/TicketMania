{% extends "base.html" %}

{% block title %}Login — Ticket Mania{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">

  <div class="p-4 p-md-5 rounded-4 border border-secondary shadow-lg" style="background: rgba(18, 25, 40, 0.95);">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="bi bi-ticket-perforated-fill"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
      <p class="text-secondary small">Sign in to view your bookings and access discounts</p>
    </div>

    <!-- Quick Demo Logins Helper -->
    <div class="p-3 mb-4 rounded-3 bg-dark border border-secondary small">
      <div class="text-secondary fw-semibold mb-2"><i class="bi bi-lightning-fill text-warning me-1"></i>Quick Demo Credentials:</div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-light btn-sm flex-fill" onclick="fillCreds('demo@ticketmania.com', 'demo123')">
          Demo User
        </button>
        <button type="button" class="btn btn-outline-warning btn-sm flex-fill" onclick="fillCreds('admin@ticketmania.com', 'admin123')">
          Admin User
        </button>
      </div>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label text-secondary small">Email Address</label>
        <input type="email" name="email" id="loginEmail" class="form-control form-control-dark" placeholder="name@example.com" required>
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary small">Password</label>
        <input type="password" name="password" id="loginPassword" class="form-control form-control-dark" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary-tm w-100 py-2 fs-6 mb-3" id="loginSubmitBtn">
        Sign In
      </button>

      <div class="text-center text-secondary small">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-danger fw-semibold">Sign Up</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
function fillCreds(email, pwd) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPassword').value = pwd;
}
</script>
{% endblock %}
