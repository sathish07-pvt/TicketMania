{% extends "base.html" %}

{% block title %}Sign Up — Ticket Mania{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">

  <div class="p-4 p-md-5 rounded-4 border border-secondary shadow-lg" style="background: rgba(18, 25, 40, 0.95);">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="bi bi-ticket-perforated-fill"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">Create Account</h3>
      <p class="text-secondary small">Start booking with Ticket Mania's discount fee system</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label text-secondary small">Full Name</label>
        <input type="text" name="name" class="form-control form-control-dark" placeholder="John Doe" required>
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary small">Email Address</label>
        <input type="email" name="email" class="form-control form-control-dark" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary small">Phone Number</label>
        <input type="tel" name="phone" class="form-control form-control-dark" placeholder="9876543210" required>
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary small">Password</label>
        <input type="password" name="password" class="form-control form-control-dark" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary-tm w-100 py-2 fs-6 mb-3">
        Create Account
      </button>

      <div class="text-center text-secondary small">
        Already have an account? <a href="{{ url_for('login') }}" class="text-danger fw-semibold">Sign In</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
